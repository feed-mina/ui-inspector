# 이미 Traefik 이 80·443 을 쓰고 있는 서버에 핀 저장 창구를 얹는다.
#
# Traefik 은 --providers.docker 로 아래 labels 를 스스로 읽는다.
# Traefik 의 설정 파일이나 컨테이너는 건드리지 않는다.
#
#   docker compose up -d --build
#
# 전제: Traefik 의 entrypoint 이름이 websecure, 인증서 발급기 이름이 letsencrypt.
# 다른 이름이면 아래 두 줄을 그 이름으로 바꾼다.
name: ui-inspector

services:
  pins:
    build: .
    image: ui-inspector-pins:latest
    container_name: ui-inspector-pins
    restart: unless-stopped
    environment:
      INSPECTOR_DATABASE_URL: sqlite+pysqlite:////var/lib/ui-inspector/inspector.db
      INSPECTOR_ALLOWED_ORIGINS: https://sdui-template-kit-productization.pages.dev
      INSPECTOR_CREATE_TABLES: "1"
    volumes:
      # 장부는 컨테이너를 다시 만들어도 남아야 한다.
      - pins-data:/var/lib/ui-inspector
    labels:
      traefik.enable: "true"
      traefik.http.routers.ui-inspector.rule: "Host(`inspector.mindevprofile.kr`)"
      traefik.http.routers.ui-inspector.entrypoints: "websecure"
      traefik.http.routers.ui-inspector.tls.certresolver: "letsencrypt"
      traefik.http.services.ui-inspector.loadbalancer.server.port: "8001"

volumes:
  pins-data:
